name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run unit tests
        run: npm test

  e2e:
    name: End-to-end smoke test
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run smoke test (offline, route-intercepted)
        run: npm run e2e
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: test/e2e/artifacts
          if-no-files-found: ignore

  package:
    name: Package extension
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify manifest and version
        id: meta
        run: |
          node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8'))"
          echo "version=$(node -p "require('./manifest.json').version")" >> "$GITHUB_OUTPUT"
      - name: Stage extension files
        run: |
          mkdir -p dist/graph-explorer-json-query
          cp -r manifest.json icons popup src vendor LICENSE dist/graph-explorer-json-query/
      # upload-artifact zips the staged folder itself, so the download is a
      # single zip: unzip it and "Load unpacked" the inner folder.
      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: graph-explorer-json-query-v${{ steps.meta.outputs.version }}
          path: dist/graph-explorer-json-query
          if-no-files-found: error

  # Every version bump that lands on main becomes a GitHub Release
  # (tag v<version>) with the ready-to-load zip attached. Re-runs on the
  # same version are no-ops, so pushes without a bump publish nothing.
  release:
    name: Publish release
    needs: [e2e, package]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: meta
        run: echo "version=$(node -p "require('./manifest.json').version")" >> "$GITHUB_OUTPUT"
      - name: Check whether this version is already released
        id: released
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.meta.outputs.version }}" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Package extension zip
        if: steps.released.outputs.exists == 'false'
        run: |
          mkdir -p dist/graph-explorer-json-query
          cp -r manifest.json icons popup src vendor LICENSE dist/graph-explorer-json-query/
          (cd dist && zip -qr "graph-explorer-json-query-v${{ steps.meta.outputs.version }}.zip" graph-explorer-json-query)
      - name: Create release
        if: steps.released.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.meta.outputs.version }}" \
            "dist/graph-explorer-json-query-v${{ steps.meta.outputs.version }}.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --title "v${{ steps.meta.outputs.version }}" \
            --generate-notes \
            --notes "Unzip the attached file and use **Load unpacked** on the inner folder — see the [README](https://github.com/$GITHUB_REPOSITORY#installation-load-unpacked) for step-by-step instructions."
